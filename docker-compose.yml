version: '3.8'

services:
  # ============================================================================
  # DATABASES
  # ============================================================================
  
  postgres:
    image: postgres:16-alpine
    container_name: artос-postgres
    environment:
      POSTGRES_DB: artbank
      POSTGRES_USER: artbank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artbank_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artbank"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artos-network

  neo4j:
    image: neo4j:5.15-community
    container_name: artos-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_secure_password}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./infrastructure/neo4j-data-load.cypher:/var/lib/neo4j/import/load.cypher
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-neo4j_secure_password} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - artos-network

  # ============================================================================
  # MESSAGE BROKER
  # ============================================================================
  
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: artos-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-artbank}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbitmq_secure_password}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - artos-network

  # ============================================================================
  # ART-OS MICROSERVICES
  # ============================================================================
  
  event-router:
    build:
      context: ./services/event-router
      dockerfile: Dockerfile
    container_name: artos-event-router
    environment:
      PORT: 8080
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-artbank}:${RABBITMQ_PASS:-rabbitmq_secure_password}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret}
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - artos-network
    restart: unless-stopped

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: artos-analytics
    environment:
      PORT: 8001
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_secure_password}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-artbank}:${RABBITMQ_PASS:-rabbitmq_secure_password}@rabbitmq:5672/
      LOG_LEVEL: info
    ports:
      - "8001:8001"
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - artos-network
    restart: unless-stopped

  transaction-hub:
    build:
      context: ./services/transaction-hub
      dockerfile: Dockerfile
    container_name: artos-transaction-hub
    environment:
      PORT: 8002
      POSTGRES_URL: postgresql://artbank:${POSTGRES_PASSWORD:-artbank_secure_password}@postgres:5432/artbank
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-artbank}:${RABBITMQ_PASS:-rabbitmq_secure_password}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret}
      LOG_LEVEL: info
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - artos-network
    restart: unless-stopped

  media-hub:
    build:
      context: ./services/media-hub
      dockerfile: Dockerfile
    container_name: artos-media-hub
    environment:
      PORT: 8003
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_secure_password}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-artbank}:${RABBITMQ_PASS:-rabbitmq_secure_password}@rabbitmq:5672/
      LOG_LEVEL: info
    ports:
      - "8003:8003"
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - artos-network
    restart: unless-stopped

  # ============================================================================
  # FRONTEND (existing Node.js app)
  # ============================================================================
  
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: artos-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      VITE_API_URL: http://event-router:8080
      DATABASE_URL: ./artbank.db
    ports:
      - "3000:3000"
    volumes:
      - ./artbank.db:/app/artbank.db
    networks:
      - artos-network
    restart: unless-stopped

  # ============================================================================
  # MONITORING (optional)
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: artos-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - artos-network
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:latest
    container_name: artos-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - artos-network
    profiles: ["monitoring"]

# ============================================================================
# NETWORKS & VOLUMES
# ============================================================================

networks:
  artos-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
